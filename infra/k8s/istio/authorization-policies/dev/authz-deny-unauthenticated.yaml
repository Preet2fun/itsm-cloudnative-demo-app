# AuthorizationPolicy — Layer 1: DENY unauthenticated requests to protected API paths.
#
# RequestAuthentication ensures tokens are VALID if present.
# This policy ensures tokens ARE present for protected paths.
#
# Public paths (no JWT required):
#   POST /api/v1/auth/login      — login endpoint
#   POST /api/v1/auth/refresh    — NOT public; requires valid JWT (listed in paths below)
#   GET  /api/v1/.well-known/jwks.json — Istio fetches JWKS from here
#   GET  /api/v1/health          — health checks
#   GET  /api/health             — frontend health check
#   /*   (non /api/v1 paths)     — frontend HTML/JS (handled by not matching paths below)

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-unauthenticated-api
  namespace: itsm-dev
spec:
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            paths:
              - /api/v1/users*
              - /api/v1/incidents*
              - /api/v1/assets*
              - /api/v1/auth/refresh
