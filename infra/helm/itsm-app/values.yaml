# values.yaml — default values for ENV=dev
# Override with values-qa.yaml for ENV=qa.
# Secrets (DATABASE_URL, JWT_SECRET) are NEVER stored here — inject via K8s Secret.

global:
  env: dev
  namespace: itsm-dev
  imageRegistry: "preet2fun"    # Docker Hub username — images: preet2fun/<service>:<tag>
  otelCollectorEndpoint: "otel-collector.itsm-dev:4317"
  # imageTag is NOT set globally — each service has its own image.tag for independent versioning

# ── User Service ──────────────────────────────────────────────────────────────
userService:
  enabled: true
  name: user-service
  image:
    repository: user-service    # full image = preet2fun/user-service:<tag>
    tag: "v0.2.0"               # bump to v0.3.0 in Phase 6 (RS256 migration)
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1

  # K8s Secret that holds DATABASE_URL and JWT_SECRET.
  # Create it manually before deploying — see Phase 3 deployment guide.
  secretName: itsm-secrets

  env:
    JWT_EXPIRY_HOURS: "24"
    OTEL_SERVICE_NAME: "user-service"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10

  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 20

# ── Redis ──────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
rabbitmq:
  enabled: true
  name: rabbitmq
  image: rabbitmq:3.13-management-alpine
  port: 5672
  managementPort: 15672
  secretName: itsm-secrets
  persistence:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# ── Asset Service ──────────────────────────────────────────────────────────────
assetService:
  enabled: true
  name: asset-service
  image:
    repository: asset-service    # full image = preet2fun/asset-service:<tag>
    tag: "v0.2.0"
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  secretName: itsm-secrets
  env:
    OTEL_SERVICE_NAME: "asset-service"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 20
    periodSeconds: 20

# ── Frontend (Synap UI — nginx:alpine serving Vite dist/) ─────────────────────
frontend:
  enabled: true
  name: frontend
  image:
    repository: frontend          # full image = preet2fun/frontend:<tag>
    tag: "v0.1.0"                 # Sprint 0 complete; bump to v0.2.0 in Sprint 1
    pullPolicy: IfNotPresent
  port: 80                        # nginx:alpine serves on port 80 (not 3000)
  replicas: 1
  # No env vars needed — nginx serves static files; Istio VirtualService handles
  # routing /api/v1/* to backend services at the mesh level.

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10

  livenessProbe:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 20

# ── Incident Service ───────────────────────────────────────────────────────────
incidentService:
  enabled: true
  name: incident-service
  image:
    repository: incident-service    # full image = preet2fun/incident-service:<tag>
    tag: "v0.2.0"
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  secretName: itsm-secrets
  env:
    OTEL_SERVICE_NAME: "incident-service"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 20
    periodSeconds: 20
