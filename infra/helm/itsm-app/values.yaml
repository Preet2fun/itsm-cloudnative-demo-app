# values.yaml — default values for ENV=dev
# Override with values-qa.yaml for ENV=qa.
# Secrets (DATABASE_URL, JWT_SECRET) are NEVER stored here — inject via K8s Secret.

global:
  env: dev
  namespace: itsm-dev
  imageRegistry: "preet2fun/"   # Docker Hub username prefix
  imageTag: latest
  otelCollectorEndpoint: "otel-collector.itsm-dev:4317"

# ── User Service ──────────────────────────────────────────────────────────────
userService:
  enabled: true
  name: user-service
  image:
    repository: user-service    # full image = preet2fun/user-service:<tag>
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1

  # K8s Secret that holds DATABASE_URL and JWT_SECRET.
  # Create it manually before deploying — see Phase 3 deployment guide.
  secretName: itsm-secrets

  env:
    JWT_EXPIRY_HOURS: "24"
    OTEL_SERVICE_NAME: "user-service"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10

  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 20

# ── Redis ──────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
rabbitmq:
  enabled: true
  name: rabbitmq
  image: rabbitmq:3.13-management-alpine
  port: 5672
  managementPort: 15672
  secretName: itsm-secrets
  persistence:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# ── Asset Service ──────────────────────────────────────────────────────────────
assetService:
  enabled: true
  name: asset-service
  image:
    repository: asset-service    # full image = preet2fun/asset-service:<tag>
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  secretName: itsm-secrets
  env:
    OTEL_SERVICE_NAME: "asset-service"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 20
    periodSeconds: 20

# ── Frontend (Next.js 14) ──────────────────────────────────────────────────────
frontend:
  enabled: true
  name: frontend
  image:
    repository: frontend          # full image = preet2fun/frontend:<tag>
    pullPolicy: IfNotPresent
  port: 3000
  replicas: 1

  env:
    # These match the default K8s service names — no change needed for standard deploy.
    # Override only if service names differ (e.g. multi-cluster or local dev).
    userServiceUrl: "http://user-service"
    incidentServiceUrl: "http://incident-service"
    assetServiceUrl: "http://asset-service"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  readinessProbe:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 10

  livenessProbe:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 20

# ── Incident Service ───────────────────────────────────────────────────────────
incidentService:
  enabled: true
  name: incident-service
  image:
    repository: incident-service    # full image = preet2fun/incident-service:<tag>
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  secretName: itsm-secrets
  env:
    OTEL_SERVICE_NAME: "incident-service"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 20
    periodSeconds: 20
