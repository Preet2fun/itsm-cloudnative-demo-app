# ci-lint.yml
# Lints all services on every push and PR.
# Go: gofmt + golangci-lint | Python: ruff | TypeScript: eslint
name: CI Lint

on:
  push:
    branches: [main, "feature/**", "sprint/**", "phase/**"]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: Lint Go services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt check — user-service
        run: |
          unformatted=$(gofmt -l platform-app/services/user-service/)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: golangci-lint — user-service
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: platform-app/services/user-service

  lint-python:
    name: Lint Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff — asset-service
        run: ruff check platform-app/services/asset-service/
      - name: ruff — incident-service
        run: ruff check platform-app/services/incident-service/

  lint-typescript:
    name: Lint TypeScript (Synap UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform-app/services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: platform-app/services/frontend
      - name: ESLint
        run: npm run lint
        working-directory: platform-app/services/frontend
      - name: TypeScript type check
        run: npm run type-check
        working-directory: platform-app/services/frontend
