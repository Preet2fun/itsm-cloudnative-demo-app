# ci-build.yml
# Builds Docker images for all services to verify Dockerfiles are valid.
# Does NOT push images — that is handled by ci-docker-push.yml.
# Full CI/CD pipeline (push + Helm deploy) is implemented in Phase 9.
name: CI Build

on:
  push:
    branches: [main, "feature/**", "sprint/**", "phase/**"]
  pull_request:
    branches: [main]

jobs:
  build-user-service:
    name: Build user-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t preet2fun/user-service:ci-${{ github.sha }} \
            platform-app/services/user-service/

  build-asset-service:
    name: Build asset-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t preet2fun/asset-service:ci-${{ github.sha }} \
            platform-app/services/asset-service/

  build-incident-service:
    name: Build incident-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t preet2fun/incident-service:ci-${{ github.sha }} \
            platform-app/services/incident-service/

  build-frontend:
    name: Build frontend (Synap UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t preet2fun/frontend:ci-${{ github.sha }} \
            platform-app/services/frontend/
