# RequestAuthentication - JWT validation for all workloads in customer-app-qa.
# Same shape as platform-app's itsm-jwt-auth - one identity engine
# (user-service in itsm-dev) issues tokens for both apps AND every
# environment (root CLAUDE.md S3) - the jwksUri below points at itsm-dev even
# here; there is no separate itsm-qa user-service to point at instead.
#
# qa parity manifest — customer-app-qa doesn't exist as a live namespace yet,
# so this is not applied by apply-istio-config.sh until it does.

# See dev/request-auth.yaml for why this is `jwks` (inline) and not `jwksUri`
# — istiod can't fetch jwksUri under user-service's STRICT mTLS, full stop.
# Same key as dev, since this still points at itsm-dev's user-service (no
# separate qa identity engine — see the file-header comment below).
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: customer-app-jwt-auth
  namespace: customer-app-qa
spec:
  jwtRules:
    - issuer: "itsm-user-service"
      jwks: |
        {
          "keys": [
            {
              "kty": "RSA",
              "use": "sig",
              "kid": "itsm-rs256-v1",
              "alg": "RS256",
              "n": "kIkOMxiwOIxCvF220iqlv1VOsUmV1IR8PSaAMhcihQj1sQBGlbdy4m3EhZmKx3kzfGxze-ayjKjzQXamE4lyrDUsGMahfzMsPUPOYpqecX0vSeME6veMrkFGYVA50i0-QHQuCwgedi_OKheA34tuMYF8u4g26siU_V6obR7J6jL4CbqxLSclu-hLHz0l2eNZJCOMiuuiz3JiCTJFIAM2cixx445TQLmvOTnxVv9ooItVz26sNfCR3govyvJbeRns0uIgMD7E7ld6lR5Gwehs1oo6lYyhd0jmHtqzI4mX50U_TpWMVFKAnS8qAD2RPq60HooGFQHLrwXIbWF0Zsu8Ew",
              "e": "AQAB"
            }
          ]
        }
      outputClaimToHeaders:
        - header: "x-tenant-id"
          claim: "tenant_id"
        - header: "x-user-role"
          claim: "role"
      forwardOriginalToken: true
