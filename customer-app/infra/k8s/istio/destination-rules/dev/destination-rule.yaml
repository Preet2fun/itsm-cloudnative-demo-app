# DestinationRule — client-side mTLS for all services in customer-app-dev.
#
# PeerAuthentication (server-side) enforces that incoming connections use mTLS.
# This DestinationRule tells the client-side Envoy to USE mTLS (ISTIO_MUTUAL)
# when initiating connections to services in this namespace.
#
# Together: server rejects plain-text AND client always sends mTLS.
# Istio auto-mTLS handles this in most cases, but explicit rules prevent
# misconfiguration when adding new services.

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: customer-app-mtls-all
  namespace: customer-app-dev
spec:
  host: "*.customer-app-dev.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
