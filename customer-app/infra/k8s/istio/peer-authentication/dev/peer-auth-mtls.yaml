# PeerAuthentication — STRICT mTLS for all workloads in customer-app-dev.
#
# All pod-to-pod communication inside the mesh must use mutual TLS.
# Plain-text connections are rejected.
#
# IMPORTANT: Apply this ONLY after all pods in customer-app-dev have been
# restarted and confirmed running with Istio sidecars (READY 2/2).
# Applying before sidecar injection will break inter-service communication.

apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: customer-app-mtls-strict
  namespace: customer-app-dev
spec:
  mtls:
    mode: STRICT
