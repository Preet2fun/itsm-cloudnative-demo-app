# values-qa.yaml — overrides for ENV=qa. Same resource envelope as dev
# (cluster budget doesn't grow for qa), different namespace + OTel endpoint.

global:
  env: qa
  namespace: customer-app-qa
  # http:// scheme is required by the OTel Java agent — see values.yaml.
  otelCollectorEndpoint: "http://otel-collector.itsm-qa:4317"

orderService:
  env:
    ENV: "qa"

catalogService:
  env:
    ENV: "qa"
