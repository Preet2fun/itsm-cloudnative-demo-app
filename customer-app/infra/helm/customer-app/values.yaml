# values.yaml — default values for ENV=dev
# Override with values-qa.yaml for ENV=qa.
# Secrets (DATABASE_URL, REDIS_URL) are NEVER stored here — inject via K8s Secret.

global:
  env: dev
  namespace: customer-app-dev
  imageRegistry: "preet2fun/"
  # Cross-namespace, in-cluster DNS — same short form (service.namespace:port,
  # no .svc.cluster.local suffix) itsm-app's own values.yaml uses for its
  # own pods, just reaching from customer-app-dev into itsm-dev.
  otelCollectorEndpoint: "otel-collector.itsm-dev:4317"

# ── Order Service (Go) ──────────────────────────────────────────────────────
orderService:
  enabled: true
  name: order-service
  image:
    repository: order-service
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  secretName: customer-app-secrets
  env:
    ENV: "dev"
    ORDER_SERVICE_PORT: "8080"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 20

# ── Catalog Service (Python) ────────────────────────────────────────────────
catalogService:
  enabled: true
  name: catalog-service
  image:
    repository: catalog-service
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  secretName: customer-app-secrets
  env:
    ENV: "dev"
    CATALOG_SERVICE_PORT: "8000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 20

# ── Delivery Service (Java) ─────────────────────────────────────────────────
deliveryService:
  enabled: true
  name: delivery-service
  image:
    repository: delivery-service
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  secretName: customer-app-secrets
  env:
    DELIVERY_SERVICE_PORT: "8080"
  # JVM (Spring Boot + OTel javaagent) needs more headroom than the Go/Python
  # services above — sized to match CLAUDE.md's existing AI-Service tier
  # (256Mi/512Mi) rather than the thin-service 128Mi/256Mi envelope, which
  # left only ~64Mi outside the -XX:MaxRAMPercentage=75.0 heap for metaspace,
  # thread stacks, and the OTel agent's own instrumentation overhead.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 30
    periodSeconds: 20

# ── Payment Service (Java) ──────────────────────────────────────────────────
paymentService:
  enabled: true
  name: payment-service
  image:
    repository: payment-service
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  secretName: customer-app-secrets
  env:
    PAYMENT_SERVICE_PORT: "8080"
  # Same JVM sizing rationale as delivery-service above.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  readinessProbe:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    path: /api/v1/health
    initialDelaySeconds: 30
    periodSeconds: 20

# ── Redis (dedicated to customer-app) ───────────────────────────────────────
redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
