<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }

<div style="display:flex; flex-direction:column; width:640px; height:480px; background:oklch(98% 0.003 250); color:oklch(28% 0.01 250); font-family:-apple-system, 'Segoe UI', sans-serif; padding:24px; gap:16px;">
  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <span style="font-size:15px; font-weight:700;">Direction B — Cool Minimal</span>
    <span style="font-size:11px; color:oklch(55% 0.01 250);">low-fi sketch</span>
  </div>

  <div style="flex:1; display:flex; border:1px solid oklch(88% 0.008 250); border-radius:6px; overflow:hidden;">
    <div style="flex:0 0 38%; background:oklch(94% 0.006 250); border-right:1px solid oklch(88% 0.008 250); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px;">
      <div style="width:28px; height:28px; border-radius:6px; background:oklch(55% 0.09 255);"></div>
      <div style="width:70%; height:8px; background:oklch(82% 0.008 250); border-radius:3px;"></div>
      <div style="width:55%; height:8px; background:oklch(82% 0.008 250); border-radius:3px;"></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:0 32px;">
      <div style="width:40%; height:10px; background:oklch(80% 0.008 250); border-radius:3px;"></div>
      <div style="width:100%; height:32px; background:oklch(97% 0.003 250); border:1px solid oklch(85% 0.008 250); border-radius:4px;"></div>
      <div style="width:100%; height:32px; background:oklch(97% 0.003 250); border:1px solid oklch(85% 0.008 250); border-radius:4px;"></div>
      <div style="width:100%; height:32px; background:oklch(55% 0.09 255); border-radius:4px;"></div>
    </div>
  </div>

  <p style="margin:0; font-size:11px; line-height:1.5; color:oklch(50% 0.01 250);">Neutral slate/blue, dense grid, square corners — closer to generic enterprise SaaS. Safe and legible, but doesn't read as distinctly "Hearth"; would blend toward Synap's own cool palette.</p>
</div>
</x-dc>
