<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; width:640px; height:480px; background:oklch(15% 0.01 40); color:oklch(96% 0.01 90); font-family:-apple-system, 'Segoe UI', sans-serif; padding:24px; gap:16px;">
  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <span style="font-size:15px; font-weight:700;">Direction C — Bold Modern</span>
    <span style="font-size:11px; color:oklch(65% 0.01 90);">low-fi sketch</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; border:1px solid oklch(30% 0.02 40); border-radius:6px; position:relative; overflow:hidden;">
    <div style="position:absolute; top:-60px; right:-60px; width:180px; height:180px; border-radius:50%; background:oklch(68% 0.19 45); opacity:0.35;"></div>
    <div style="width:36px; height:36px; border-radius:50%; background:oklch(68% 0.19 45); position:relative;"></div>
    <div style="width:220px; height:12px; background:oklch(30% 0.02 40); border-radius:3px; position:relative;"></div>
    <div style="width:260px; display:flex; flex-direction:column; gap:10px; position:relative;">
      <div style="height:34px; background:oklch(20% 0.015 40); border:1px solid oklch(32% 0.02 40); border-radius:8px;"></div>
      <div style="height:34px; background:oklch(20% 0.015 40); border:1px solid oklch(32% 0.02 40); border-radius:8px;"></div>
      <div style="height:34px; background:oklch(68% 0.19 45); border-radius:8px;"></div>
    </div>
  </div>

  <p style="margin:0; font-size:11px; line-height:1.5; color:oklch(70% 0.01 90);">Dark mode, one saturated accent, single centered card instead of a split panel. Higher energy, more memorable — but a bigger swing than a first-login screen usually needs, and dark-mode-only cuts against a daytime, front-counter admin tool.</p>
</div>
</x-dc>
</body>
</html>
