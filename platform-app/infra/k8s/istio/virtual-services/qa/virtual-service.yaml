# VirtualService — QA environment path-based routing
# References the shared itsm-gateway in itsm-dev (cross-namespace).
# Route map mirrors dev exactly; service hostnames resolve within itsm-qa.

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: itsm-routing
  namespace: itsm-qa
spec:
  hosts:
    - "*"
  gateways:
    - itsm-dev/itsm-gateway
  http:
    # Auth + JWKS (user-service)
    - match:
        - uri:
            prefix: /api/v1/auth/
        - uri:
            prefix: /api/v1/.well-known/
      route:
        - destination:
            host: user-service.itsm-qa.svc.cluster.local
            port:
              number: 80

    # User management
    - match:
        - uri:
            prefix: /api/v1/users/
      route:
        - destination:
            host: user-service.itsm-qa.svc.cluster.local
            port:
              number: 80

    # Incidents
    - match:
        - uri:
            prefix: /api/v1/incidents/
      route:
        - destination:
            host: incident-service.itsm-qa.svc.cluster.local
            port:
              number: 80

    # Assets
    - match:
        - uri:
            prefix: /api/v1/assets/
      route:
        - destination:
            host: asset-service.itsm-qa.svc.cluster.local
            port:
              number: 80

    # Frontend catch-all (Vite+React SPA via nginx:alpine)
    - route:
        - destination:
            host: frontend.itsm-qa.svc.cluster.local
            port:
              number: 80
