# DestinationRule — client-side mTLS for all services in itsm-qa.
# Mirrors dev config; host pattern scoped to itsm-qa namespace.

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: itsm-mtls-all
  namespace: itsm-qa
spec:
  host: "*.itsm-qa.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
