# OPA Deployment — Open Policy Agent with Envoy ext_authz plugin
#
# OPA listens on gRPC :9191 (Envoy ext_authz) and HTTP :8181 (health/query API).
# Istio sidecar injection is disabled — OPA is the authz layer, not a workload.
# Policy is loaded from ConfigMap at startup.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: itsm-dev
  labels:
    app: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:0.65.0-envoy
          args:
            - run
            - --server
            - --config-file=/config/config.yaml
            - --log-format=json
            - --log-level=info
            - /policies/authz.rego
          ports:
            - name: grpc
              containerPort: 9191
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: opa-config
              mountPath: /config
            - name: opa-policy
              mountPath: /policies
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: opa-config
          configMap:
            name: opa-config
        - name: opa-policy
          configMap:
            name: opa-policy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
