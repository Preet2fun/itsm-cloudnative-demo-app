apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: itsm-dev
  labels:
    app: opa
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: grpc
      port: 9191
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8181
      targetPort: http
      protocol: TCP
