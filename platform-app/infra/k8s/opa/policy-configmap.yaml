apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy
  namespace: itsm-dev
# The Rego policy below is kept byte-for-byte in sync with
# platform-app/infra/k8s/opa/authz.rego (the opa-test-able copy). Edit both.
data:
  authz.rego: |
    package envoy.authz

    import future.keywords.if
    import future.keywords.in

    default allow := false

    # ── Helpers ────────────────────────────────────────────────────────────────
    method := input.attributes.request.http.method
    path   := input.attributes.request.http.path

    # role is read directly from the JWT's own "role" claim, not from an
    # x-user-role header. Istio's CUSTOM AuthorizationPolicy action (this
    # filter) runs BEFORE jwt_authn in the Envoy filter chain - confirmed live
    # 2026-09-17 via the actual filter order (rbac, ext_authz, jwt_authn, rbac)
    # and OPA's own decision log, which showed no x-user-role header present on
    # requests this filter evaluates. jwt_authn's claim_to_headers injection
    # simply hasn't happened yet at this point.
    #
    # This verifies the signature itself (io.jwt.decode_verify), rather than
    # relying on jwt_authn running afterward to catch a forged token - an
    # earlier version of this rule used unverified io.jwt.decode on the
    # reasoning that jwt_authn independently re-checks the signature right
    # after in the same filter chain. That's true for every path currently
    # wired up, but it's an implicit coupling this file can't enforce or make
    # visible on its own - a future ext_authz-protected route added without a
    # matching jwt_authn gate would have no signature check at all. Verifying
    # here removes that dependency entirely (flagged by automated security
    # review, 2026-09-17).
    #
    # jwt_public_key is the same "itsm-rs256-v1" public key pinned in the
    # RequestAuthentication manifests (platform-app and customer-app's
    # request-auth.yaml) for the same underlying reason: OPA has no live JWKS
    # access either, and doesn't need one here since the key changing is a rare,
    # deliberate operation (see those files for the full jwksUri-under-STRICT-
    # mTLS writeup). Captured live 2026-09-16 from
    # http://user-service.itsm-dev.svc.cluster.local/api/v1/.well-known/jwks.json
    # - if user-service's signing key is ever rotated, this must be updated too.
    jwt_public_key := `{"kty":"RSA","use":"sig","kid":"itsm-rs256-v1","alg":"RS256","n":"kIkOMxiwOIxCvF220iqlv1VOsUmV1IR8PSaAMhcihQj1sQBGlbdy4m3EhZmKx3kzfGxze-ayjKjzQXamE4lyrDUsGMahfzMsPUPOYpqecX0vSeME6veMrkFGYVA50i0-QHQuCwgedi_OKheA34tuMYF8u4g26siU_V6obR7J6jL4CbqxLSclu-hLHz0l2eNZJCOMiuuiz3JiCTJFIAM2cixx445TQLmvOTnxVv9ooItVz26sNfCR3govyvJbeRns0uIgMD7E7ld6lR5Gwehs1oo6lYyhd0jmHtqzI4mX50U_TpWMVFKAnS8qAD2RPq60HooGFQHLrwXIbWF0Zsu8Ew","e":"AQAB"}`

    role := claims.role if {
      auth_header := input.attributes.request.http.headers.authorization
      startswith(auth_header, "Bearer ")
      token := substring(auth_header, count("Bearer "), -1)
      [valid, _, claims] := io.jwt.decode_verify(token, {
        "cert": jwt_public_key,
        "iss": "itsm-user-service",
      })
      valid
    }

    # ── Public paths — allow without JWT ──────────────────────────────────────
    # Login endpoint
    public if { path == "/api/v1/auth/login" }
    # MFA endpoints — a user has no JWT yet at this point in the flow
    public if { path == "/api/v1/auth/mfa/send" }
    public if { path == "/api/v1/auth/mfa/verify" }
    # JWKS endpoint (Istio fetches this)
    public if { startswith(path, "/api/v1/.well-known/") }
    # Health checks on any service
    public if { endswith(path, "/health") }
    # All non-API paths: Next.js pages, _next/static, favicons, etc.
    public if { not startswith(path, "/api/v1/") }

    allow if { public }

    # ── Admin — full access to all API paths ───────────────────────────────────
    allow if { role == "admin" }

    # ── Agent — read/write on incidents and assets; read-only on users ─────────
    allow if {
      role == "agent"
      startswith(path, "/api/v1/incidents")
      method in {"GET", "POST", "PUT", "PATCH", "DELETE"}
    }
    allow if {
      role == "agent"
      startswith(path, "/api/v1/assets")
      method in {"GET", "POST", "PUT", "PATCH"}
    }
    allow if {
      role == "agent"
      startswith(path, "/api/v1/users")
      method == "GET"
    }

    # ── Viewer — read-only on incidents and assets ─────────────────────────────
    allow if {
      role == "viewer"
      startswith(path, "/api/v1/incidents")
      method == "GET"
    }
    allow if {
      role == "viewer"
      startswith(path, "/api/v1/assets")
      method == "GET"
    }
