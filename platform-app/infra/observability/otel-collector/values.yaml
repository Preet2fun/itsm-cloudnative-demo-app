mode: deployment
replicaCount: 1
fullnameOverride: "otel-collector"

# Required since chart 0.89.0 — no default image anymore. contrib, not the
# plain/k8s distro, because our pipeline uses the `prometheus` exporter,
# which is a contrib-only component.
image:
  repository: "otel/opentelemetry-collector-contrib"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"
  prometheus.io/path: "/metrics"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    batch: {}
  exporters:
    # Named otlp_grpc, not otlp — the chart renamed this exporter to
    # disambiguate from otlp_http; 0.173.1 auto-rewrites the old name with a
    # deprecation warning, this avoids relying on that rewrite.
    otlp_grpc:
      endpoint: jaeger.itsm-dev.svc.cluster.local:4317
      tls:
        insecure: true
    prometheus:
      # 8889, not 8888 — 8888 is this chart's own internal self-telemetry
      # metrics port (service.telemetry.metrics.address defaults there; see
      # the "metrics" entry in `ports:` below). Binding our app-metrics
      # exporter to the same port crashes the collector at startup with
      # "address already in use" — confirmed live 2026-09-17.
      endpoint: 0.0.0.0:8889
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp_grpc]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
  app-metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

service:
  type: ClusterIP
