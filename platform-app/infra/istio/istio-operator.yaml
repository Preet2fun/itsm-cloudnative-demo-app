# istio-operator.yaml — Istio control-plane configuration
# Install with: istioctl install -f infra/istio/istio-operator.yaml -y
#
# Profile: demo (istiod + ingress gateway)
# IngressGateway: NodePort 30080 (HTTP) / 30443 (HTTPS)
# Egress gateway: disabled (not needed for this app)
# Resource limits: tuned for 16 GB / 3-node kubeadm cluster

apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: itsm-control-plane
spec:
  profile: demo

  meshConfig:
    accessLogFile: /dev/stdout
    # Register OPA as a named ext_authz provider.
    # Referenced by AuthorizationPolicy CUSTOM action in infra/k8s/opa/authz-policy-custom/
    extensionProviders:
      - name: opa-authz
        envoyExtAuthzGrpc:
          service: opa.itsm-dev.svc.cluster.local
          port: "9191"
      - name: opa-authz-qa
        envoyExtAuthzGrpc:
          service: opa.itsm-qa.svc.cluster.local
          port: "9191"

  components:
    # ── Istiod (control plane) ─────────────────────────────────────────────────
    pilot:
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # ── Ingress Gateway ────────────────────────────────────────────────────────
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: NodePort
            ports:
              - port: 15021
                targetPort: 15021
                name: status-port
                nodePort: 30021
              - port: 80
                targetPort: 8080
                name: http2
                nodePort: 30080
              - port: 443
                targetPort: 8443
                name: https
                nodePort: 30443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

    # ── Egress Gateway — disabled ──────────────────────────────────────────────
    egressGateways:
      - name: istio-egressgateway
        enabled: false

  values:
    global:
      # Envoy sidecar resource limits — applied to every injected pod
      proxy:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
