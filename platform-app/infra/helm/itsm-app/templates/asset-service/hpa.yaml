{{- if .Values.assetService.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.assetService.name }}-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.assetService.name }}
    environment: {{ .Values.global.env }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.assetService.name }}
  minReplicas: {{ .Values.assetService.hpa.minReplicas }}
  maxReplicas: {{ .Values.assetService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.assetService.hpa.targetCPUUtilizationPercentage }}
{{- end }}
