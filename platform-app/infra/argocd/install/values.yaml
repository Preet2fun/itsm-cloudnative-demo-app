# ArgoCD core install — server + repo-server + application-controller +
# redis only. dex/notifications off (no SSO, no external alerting needed
# for a solo-dev demo). applicationSet has no `enabled` toggle in this
# chart version (confirmed live 2026-09-24 via
# `helm show values argo/argo-cd --version 10.9.2`) — replicas: 0 is the
# only way to disable it; the Deployment/Service objects still get
# created but run no pods.

# The Istio Gateway/VirtualService routing this UI through
# (infra/k8s/istio/virtual-services/dev/argocd-routing.yaml) is plain HTTP,
# same as Grafana/Jaeger/Prometheus — no TLS passthrough configured. By
# default argocd-server only speaks TLS on its single port regardless of
# which Service port (80 vs 443) you hit; without this flag it rejects the
# Gateway's plaintext requests. Confirmed live 2026-09-24
# (ERR_SSL_PROTOCOL_ERROR without it).
configs:
  params:
    server.insecure: "true"

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 64m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  # Chart default probe timeoutSeconds is 1 — confirmed live 2026-09-25 this
  # is too tight on kubernetes-master (the cluster's most contended node:
  # 76% memory used, also hosting etcd/apiserver/scheduler/istiod/
  # ingressgateway/argocd-server). The container itself was healthy
  # (33Mi/256Mi memory in use, exit 143/SIGTERM not 137/OOMKilled) but
  # missed the 1s HTTP health-check deadline under node contention,
  # tripping 15 restarts in 7h. Same fix pattern already used for
  # delivery/payment-service's probes in customer-app's values.yaml.
  readinessProbe:
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5

controller:
  # 128Mi/256Mi was too tight — confirmed live 2026-09-25 the controller
  # got OOMKilled (exit 137) mid-sync and entered CrashLoopBackOff. Not
  # really about this one Application's ~14 resources: the controller
  # caches ALL live cluster resources across every namespace for
  # watch-based reconciliation, and this cluster carries a lot of CRDs
  # (Istio, Calico, cert-manager, Rancher) plus 40+ pods — a much bigger
  # working set than the Application-scoped sizing assumed.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
